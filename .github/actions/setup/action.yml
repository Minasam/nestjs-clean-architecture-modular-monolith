name: Setup Node and pnpm
description: Installs the pinned pnpm (packageManager) and Node (.nvmrc), restores the pnpm cache and installs dependencies.
runs:
  using: composite
  steps:
    - name: Install pnpm (version from package.json packageManager)
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Set up Node (version from .nvmrc)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

# Weekly security re-scan of main (ADR 0009): new vulnerabilities are published every day,
# so dependencies are re-checked even when no code changed. Also runs OpenSSF Scorecard.
name: Security (scheduled)

on:
  schedule:
    - cron: '41 4 * * 1' # weekly, Monday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scheduled
  cancel-in-progress: false

jobs:
  scans:
    name: Security scans (main)
    uses: ./.github/workflows/security-scans.yml
    with:
      full-history: true

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload Scorecard results to the Security tab
      id-token: write # publish results to the OpenSSF API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
